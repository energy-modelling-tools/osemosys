# Backs the OSeMOSYS Project Registry table in the Project Registry section of
# get_involved.markdown (published at /osemosys/contact/#project-registry).
#
# Each "Register an OSeMOSYS Project" issue opens a pull request that appends a
# block below (.github/workflows/registry-entry-to-pr.yml); merging it publishes
# the entry. The `issue` field ties a block to its issue so later edits to that
# issue replace the block instead of adding a duplicate.
# Field names must match what get_involved.markdown reads.
#
# The list is empty until the first project is accepted; the page shows an
# invitation to register instead of an empty table.

# --- Template for a new entry (copy, uncomment, fill in) ---
# - project_name: ""
#   institutions: ""
#   country_region: ""
#   scope: ""            # Power sector only | Whole energy system | CLEWs nexus | Other
#   status: ""           # Active | Completed | Planned
#   start_date: ""       # YYYY or YYYY-MM
#   contact_name: ""
#   contact_email: ""
#   linked_outputs: ""   # optional — shown as a link on the project name
#   funders: ""          # optional
#   tags: []             # optional
#   last_confirmed: ""   # set by the maintainer at merge or reconfirmation time
#   issue: 0             # number of the registration issue

- project_name: "OSeMOSYS-COL"
  institutions: "Universidad Industrial de Santander"
  country_region: "Colombia"
  scope: "Whole energy system"
  status: "Completed"
  start_date: "2023-03"
  contact_name: "Fernando Plazas"
  contact_email: "fernando.plazas11@gmail.com"
  linked_outputs: "https://zenodo.org/records/8305752"
  tags: ["national energy plan", "energy policy", "energy transition"]
  last_confirmed: "2026-09-30"
  issue: 11

